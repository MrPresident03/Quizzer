name: Question bank

on:
  push:
    branches: [feature/question-bank]
    paths: ['tools/questions/**', '.github/workflows/question-bank.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

concurrency:
  group: question-bank-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build question bank
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Unit tests
        run: python3 -m unittest discover tools/questions

      - name: Fetch Open Trivia DB
        timeout-minutes: 30
        run: python3 tools/questions/fetch_opentdb.py

      - name: Fetch Wikidata
        timeout-minutes: 26
        run: python3 tools/questions/fetch_wikidata.py

      - name: Build bank
        run: python3 tools/questions/build_bank.py

      - name: Job summary
        run: cat tools/questions/STATS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit outputs to branch
        if: github.ref == 'refs/heads/feature/question-bank'
        run: |
          git add tools/questions/sources app/src/main/assets/questions.json tools/questions/STATS.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update generated question bank"
          git push origin HEAD:feature/question-bank

      - name: Open or update pull request
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add tools/questions/sources app/src/main/assets/questions.json tools/questions/STATS.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/question-bank-update
          git commit -m "Update generated question bank"
          git push --force origin bot/question-bank-update
          if [ -z "$(gh pr list --head bot/question-bank-update --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head bot/question-bank-update \
              --title "Update generated question bank" \
              --body "Automated monthly refresh of the bundled question bank (see tools/questions/STATS.md). Content derived from Open Trivia DB is CC BY-SA 4.0; Wikidata is CC0."
          fi
