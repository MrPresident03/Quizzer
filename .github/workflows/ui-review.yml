name: UI review (emulator)

# Test-only: runs the debug app on a real emulator, screenshots every screen in three passes
# (light / dark / 1.5x font), measures startup time and monkey-tests it. Nothing here changes app code.
# Runs on every push to a fix/** branch and on demand. The last job commits the screenshots and
# reports to an orphan branch ui-review/<run_id>, so they can be fetched with plain git:
#   git fetch origin ui-review/<run_id>
on:
  push:
    branches: [ 'fix/**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug + androidTest APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble APKs
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace 2>&1 | tee build-output.txt

      - name: Collect APKs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/debug/*.apk apks/
          cp app/build/outputs/apk/androidTest/debug/*.apk apks/
          ls -l apks

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|FAILED" build-output.txt | head -40

      - uses: actions/upload-artifact@v7
        with:
          name: ui-review-apks
          path: apks/*.apk
          if-no-files-found: error

  ui-review:
    name: Emulator (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pixel_6
            profile: pixel_6
          - name: small_nexus4
            profile: Nexus 4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ui-review-apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI review on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 3072M
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash .github/scripts/ui-review-run.sh ${{ matrix.name }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-review-${{ matrix.name }}-screenshots
          path: ui-review-out/${{ matrix.name }}/shots
          if-no-files-found: warn

      - name: Upload timings, monkey and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-review-${{ matrix.name }}-reports
          path: |
            ui-review-out/${{ matrix.name }}
            !ui-review-out/${{ matrix.name }}/shots
          if-no-files-found: warn

  # Artifacts can't be downloaded from every environment, but git can be fetched anywhere: publish
  # the run's screenshots and reports as a one-commit orphan branch.
  publish-results:
    name: Publish results branch
    needs: [build, ui-review]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ui-review-*-*
          path: downloaded

      - name: Assemble results
        run: |
          mkdir -p results
          for p in pixel_6 small_nexus4; do
            mkdir -p "results/$p"
            if [ -d "downloaded/ui-review-$p-reports" ]; then
              cp -a "downloaded/ui-review-$p-reports/." "results/$p/"
            fi
            if [ -d "downloaded/ui-review-$p-screenshots" ]; then
              mkdir -p "results/$p/shots"
              if command -v mogrify > /dev/null; then
                # Keeps the branch small (hundreds of full-size PNGs add up): 720px wide JPEGs are plenty to review.
                mogrify -path "results/$p/shots" -resize '720x>' -quality 85 -format jpg "downloaded/ui-review-$p-screenshots"/*.png || true
              else
                cp -a "downloaded/ui-review-$p-screenshots/." "results/$p/shots/"
              fi
              cp -a "downloaded/ui-review-$p-screenshots"/*.log "results/$p/shots/" 2>/dev/null || true
            fi
          done
          # Raw logcats can be huge; keep them compressed.
          find results -type f -name '*.txt' -size +1M -exec gzip -9 {} +
          {
            echo "UI review run ${{ github.run_id }}"
            echo "commit ${{ github.sha }} (${{ github.ref_name }})"
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > results/README.txt
          du -sh results
          find results -type f | wc -l

      - name: Commit to ui-review/${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd results
          git init -q -b results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI review results for run ${{ github.run_id }} (${{ github.sha }})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/ui-review/${{ github.run_id }}"
          echo "Results: branch ui-review/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
