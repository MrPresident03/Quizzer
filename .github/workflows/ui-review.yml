name: UI review (emulator)

# Test-only: runs the debug app on a real emulator, screenshots every screen in three passes
# (light / dark / 1.5x font), measures startup time and monkey-tests it. Nothing here changes app code.
on:
  push:
    branches: [ review/app-audit ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug + androidTest APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble APKs
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace 2>&1 | tee build-output.txt

      - name: Collect APKs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/debug/*.apk apks/
          cp app/build/outputs/apk/androidTest/debug/*.apk apks/
          ls -l apks

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|FAILED" build-output.txt | head -40

      - uses: actions/upload-artifact@v7
        with:
          name: ui-review-apks
          path: apks/*.apk
          if-no-files-found: error

  ui-review:
    name: Emulator (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pixel_6
            profile: pixel_6
          - name: small_nexus4
            profile: Nexus 4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ui-review-apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI review on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 3072M
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash .github/scripts/ui-review-run.sh ${{ matrix.name }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-review-${{ matrix.name }}-screenshots
          path: ui-review-out/${{ matrix.name }}/shots
          if-no-files-found: warn

      - name: Upload timings, monkey and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-review-${{ matrix.name }}-reports
          path: |
            ui-review-out/${{ matrix.name }}
            !ui-review-out/${{ matrix.name }}/shots
          if-no-files-found: warn
